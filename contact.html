<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Jasmyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
    }
    .logo {
      display: block;
      width: min(400px, 88vw);
      margin: 1.25rem auto 0;
    }
    .logo img { width: 100%; height: auto; display: block; }
    .nav {
      padding: 0.4rem 2rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #e591a6;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .nav a {
        margin: 0 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 1px;
      }
    }
    .contact {
      max-width: 500px;
      margin: 3.5rem auto;
      padding: 0 1.5rem;
      text-align: center;
    }
    .contact h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: #e591a6;
      margin-bottom: 1.25rem;
    }
    .contact a {
      color: #e591a6;
      font-size: 1.1rem;
    }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    footer a {
      color: #e591a6;
      margin: 0 0.55rem;
      display: inline-flex;
      text-decoration: none;
    }
    footer a:hover { color: #c45d7a; }
    footer svg { display: block; }
  </style>
</head>
<body>
  <a class="logo" href="index.html">
    <img src="images/jasmyn-logo.png" alt="Jasmyn">
  </a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="contact">
    <h1>Contact</h1>
    <p>For bookings and inquiries</p>
    <p style="margin-top: 1.5rem;"><a href="mailto:hello@jasmyn.co.uk">hello@jasmyn.co.uk</a></p>
  </div>

  <footer>
    <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="mailto:hello@jasmyn.co.uk" aria-label="Email">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M4 7l8 6 8-6"/>
      </svg>
    </a>
    <a href="https://www.tiktok.com/discover/jasmynericka32" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18.2a2.4 2.4 0 1 1-1.7-2.3"/>
        <path d="M9 16V5.8"/>
        <path d="M9 8.2c1.2 1.7 3 2.7 5.2 2.8"/>
      </svg>
    </a>
  </footer>
</body>
</html>
