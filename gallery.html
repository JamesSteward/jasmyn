<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Jasmyn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
    }
    .logo {
      display: block;
      width: min(400px, 88vw);
      margin: 1.25rem auto 0;
    }
    .logo img { width: 100%; height: auto; display: block; }
    .nav {
      padding: 0.4rem 2rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #e591a6;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .nav a {
        margin: 0 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 1px;
      }
    }
    .carousel {
      position: relative;
    }
    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      height: min(78vh, 760px, calc(100vw * 4 / 3));
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-track img {
      height: 100%;
      width: auto;
      flex: 0 0 auto;
      scroll-snap-align: start;
      display: block;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 3rem;
      height: 4.5rem;
      border: 0;
      padding: 0;
      background: transparent;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
      cursor: pointer;
    }
    .carousel-btn.prev { left: 0.35rem; }
    .carousel-btn.next { right: 0.35rem; }
    .carousel-btn:disabled {
      opacity: 0;
      pointer-events: none;
    }
    .carousel-btn svg { display: block; margin: 0 auto; }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    footer a {
      color: #e591a6;
      margin: 0 0.55rem;
      display: inline-flex;
      text-decoration: none;
    }
    footer a:hover { color: #c45d7a; }
    footer svg { display: block; }
  </style>
</head>
<body>
  <a class="logo" href="index.html">
    <img src="images/jasmyn-logo.png" alt="Jasmyn">
  </a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="carousel">
    <button class="carousel-btn prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
    </button>
    <div class="carousel-track" tabindex="0" aria-label="Portfolio photos">
      <img src="images/jasmyn-02.jpg" alt="Jasmyn">
      <img src="images/jasmyn-03.jpg" alt="Jasmyn">
      <img src="images/jasmyn-04.jpg" alt="Jasmyn">
      <img src="images/jasmyn-05.jpg" alt="Jasmyn">
    </div>
    <button class="carousel-btn next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M9 5 L16 12 L9 19"/>
      </svg>
    </button>
  </div>
  <script>
    const track = document.querySelector(".carousel-track");
    const prev = document.querySelector(".carousel-btn.prev");
    const next = document.querySelector(".carousel-btn.next");

    function step() {
      const img = track.querySelector("img");
      return img ? img.getBoundingClientRect().width : track.clientWidth;
    }

    function update() {
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
    }

    prev.addEventListener("click", () => {
      track.scrollBy({ left: -step(), behavior: "smooth" });
    });
    next.addEventListener("click", () => {
      track.scrollBy({ left: step(), behavior: "smooth" });
    });
    track.addEventListener("scroll", update, { passive: true });
    track.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        next.click();
        event.preventDefault();
      } else if (event.key === "ArrowLeft") {
        prev.click();
        event.preventDefault();
      }
    });
    window.addEventListener("resize", update);
    track.querySelectorAll("img").forEach((img) => img.addEventListener("load", update));
    update();
  </script>

  <footer>
    <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="mailto:hello@jasmyn.co.uk" aria-label="Email">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M4 7l8 6 8-6"/>
      </svg>
    </a>
    <a href="https://www.tiktok.com/discover/jasmynericka32" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18.2a2.4 2.4 0 1 1-1.7-2.3"/>
        <path d="M9 16V5.8"/>
        <path d="M9 8.2c1.2 1.7 3 2.7 5.2 2.8"/>
      </svg>
    </a>
  </footer>
</body>
</html>
