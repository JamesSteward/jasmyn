<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Jasmyn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FDF6F6;
      color: #111;
    }
    .logo {
      display: block;
      width: min(400px, 88vw);
      margin: 1.25rem auto 0;
    }
    .logo img { width: 100%; height: auto; display: block; }
    .nav {
      padding: 0.4rem 2rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #e591a6;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .nav a {
        margin: 0 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 1px;
      }
    }
    .sets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 1.15rem;
      padding: 0.95rem 1rem 1.05rem;
    }
    .sets button {
      border: 0;
      background: none;
      padding: 0.15rem 0;
      color: #e591a6;
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .sets button[aria-pressed="true"] {
      text-decoration: underline;
      text-underline-offset: 0.35em;
    }
    @media (max-width: 520px) {
      .sets { gap: 0.55rem 0.85rem; }
      .sets button { font-size: 0.68rem; letter-spacing: 0.08em; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.75rem;
      padding: 0 0.75rem 2.5rem;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .grid img[hidden] { display: none; }
    .sets-empty {
      margin: 0;
      padding: 4.5rem 1.5rem;
      text-align: center;
      color: #888;
      font-size: 0.95rem;
    }
    .sets-empty[hidden] { display: none; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.45rem; }
    }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    footer a {
      color: #e591a6;
      margin: 0 0.55rem;
      display: inline-flex;
      text-decoration: none;
    }
    footer a:hover { color: #c45d7a; }
    footer svg { display: block; }
    .label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <a class="logo" href="index.html">
    <img src="images/jasmyn-logo.png" alt="Jasmyn">
  </a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <nav class="sets" aria-label="Portfolio filters">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="fashion" aria-pressed="false">Fashion</button>
    <button type="button" data-filter="editorial" aria-pressed="false">Editorial</button>
    <button type="button" data-filter="beauty" aria-pressed="false">Beauty</button>
    <button type="button" data-filter="commercial" aria-pressed="false">Commercial</button>
    <button type="button" data-filter="lingerie" aria-pressed="false">Lingerie &amp; Sleepwear</button>
  </nav>

  <div class="grid">
    <img src="images/jasmyn-02.jpg" alt="Jasmyn" data-category="fashion">
    <img src="images/jasmyn-03.jpg" alt="Jasmyn" data-category="editorial">
    <img src="images/jasmyn-04.jpg" alt="Jasmyn" data-category="beauty">
    <img src="images/jasmyn-05.jpg" alt="Jasmyn" data-category="commercial">
    <img src="images/jasmyn-06.jpg" alt="Jasmyn" data-category="lingerie">
    <img src="images/jasmyn-07.jpg" alt="Jasmyn" data-category="fashion">
  </div>
  <p class="sets-empty" hidden>No photos in this set yet.</p>
  <script>
    const filters = document.querySelectorAll(".sets button");
    const photos = document.querySelectorAll(".grid img");
    const empty = document.querySelector(".sets-empty");

    function applyFilter(category) {
      let shown = 0;
      filters.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.filter === category ? "true" : "false");
      });
      photos.forEach((photo) => {
        const match = category === "all" || photo.dataset.category === category;
        photo.hidden = !match;
        if (match) shown += 1;
      });
      empty.hidden = shown > 0;
    }

    filters.forEach((button) => {
      button.addEventListener("click", () => applyFilter(button.dataset.filter));
    });
  </script>

  <footer>
    <a href="https://www.instagram.com/jasmynxox10" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
      <span class="label">Instagram</span>
    </a>
    <a href="mailto:hello@jasmyn.co.uk">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
        <path d="M4 7l8 6 8-6"/>
      </svg>
      <span class="label">Email</span>
    </a>
    <a href="https://www.tiktok.com/@jasmynericka32" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18.2a2.4 2.4 0 1 1-1.7-2.3"/>
        <path d="M9 16V5.8"/>
        <path d="M9 8.2c1.2 1.7 3 2.7 5.2 2.8"/>
      </svg>
      <span class="label">TikTok</span>
    </a>
  </footer>
</body>
</html>
