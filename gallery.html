<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Jasmyn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FDF6F6;
      color: #111;
    }
    .logo {
      display: block;
      width: min(400px, 88vw);
      margin: 1.25rem auto 0;
    }
    .logo img { width: 100%; height: auto; display: block; }
    .nav {
      padding: 0.4rem 2rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #e591a6;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .nav a {
        margin: 0 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 1px;
      }
    }
    .sets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 1.15rem;
      padding: 0.95rem 1rem 1.05rem;
    }
    .sets button {
      border: 0;
      background: none;
      padding: 0.15rem 0;
      color: #e591a6;
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .sets button[aria-pressed="true"] {
      text-decoration: underline;
      text-underline-offset: 0.35em;
    }
    @media (max-width: 520px) {
      .sets { gap: 0.55rem 0.85rem; }
      .sets button { font-size: 0.68rem; letter-spacing: 0.08em; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.75rem;
      padding: 0 0.75rem 2.5rem;
    }
    .shot { margin: 0; }
    .shot[hidden] { display: none; }
    .shot img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .shot figcaption {
      margin-top: 0.45rem;
      font-size: 0.75rem;
      line-height: 1.4;
      text-align: center;
      color: #777;
    }
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 4.5rem 1.25rem;
      background: rgba(17, 17, 17, 0.92);
    }
    .viewer[hidden] { display: none; }
    .viewer-frame {
      max-width: min(920px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .viewer img {
      max-width: 100%;
      max-height: calc(100vh - 6.5rem);
      object-fit: contain;
    }
    .viewer-caption {
      margin-top: 0.85rem;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
    }
    .viewer-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 3rem;
      height: 4.5rem;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }
    .viewer-arrow.prev { left: 0.4rem; }
    .viewer-arrow.next { right: 0.4rem; }
    .viewer-arrow svg { display: block; margin: 0 auto; }
    @media (max-width: 700px) {
      .viewer { padding: 1rem 2.75rem 1rem; }
      .viewer img { max-height: calc(100vh - 5.5rem); }
    }
    .sets-empty {
      margin: 0;
      padding: 4.5rem 1.5rem;
      text-align: center;
      color: #888;
      font-size: 0.95rem;
    }
    .sets-empty[hidden] { display: none; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.45rem; }
    }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    footer a {
      color: #e591a6;
      margin: 0 0.55rem;
      display: inline-flex;
      text-decoration: none;
    }
    footer a:hover { color: #c45d7a; }
    footer svg { display: block; }
    .label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <a class="logo" href="index.html">
    <img src="images/jasmyn-logo.png" alt="Jasmyn">
  </a>
  <nav class="nav">
    <a href="index.html">Home</a>

    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <nav class="sets" aria-label="Portfolio filters">
    <button type="button" data-filter="all" aria-pressed="true">All</button>

    <button type="button" data-filter="editorial" aria-pressed="false">Editorial</button>
    <button type="button" data-filter="beauty" aria-pressed="false">Beauty</button>
    <button type="button" data-filter="commercial" aria-pressed="false">Commercial</button>
    <button type="button" data-filter="lingerie" aria-pressed="false">Lingerie &amp; Sleepwear</button>
  </nav>

  <div class="grid">
    <figure class="shot">
      <img src="images/jasmyn-02.jpg" alt="Jasmyn" data-category="fashion" data-photographer="Model's own" data-client="">
      <figcaption></figcaption>
    </figure>
    <figure class="shot">
      <img src="images/jasmyn-03.jpg" alt="Jasmyn" data-category="editorial" data-photographer="Model's own" data-client="">
      <figcaption></figcaption>
    </figure>
    <figure class="shot">
      <img src="images/jasmyn-04.jpg" alt="Jasmyn" data-category="beauty" data-photographer="Model's own" data-client="">
      <figcaption></figcaption>
    </figure>
    <figure class="shot">
      <img src="images/jasmyn-05.jpg" alt="Jasmyn" data-category="commercial" data-photographer="Model's own" data-client="">
      <figcaption></figcaption>
    </figure>
    <figure class="shot">
      <img src="images/jasmyn-06.jpg" alt="Jasmyn" data-photographer="Model's own" data-client="">
      <figcaption></figcaption>

    <figure class="shot">
      <img src="images/jasmyn-07.jpg" alt="Jasmyn" data-category="fashion" data-photographer="Model's own" data-client="">

    <figure class="shot">
      <img src="images/lingerie-01.webp" alt="Jasmyn" data-category="lingerie" data-photographer="Model's own" data-client="">

  </div>
  <p class="sets-empty" hidden>No photos in this set yet.</p>

  <div class="viewer" hidden>
    <button class="viewer-arrow prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
    </button>
    <div class="viewer-frame">
      <img alt="">
      <p class="viewer-caption"></p>
    </div>
    <button class="viewer-arrow next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M9 5 L16 12 L9 19"/>
      </svg>
    </button>
  </div>
  <script>
    const filters = document.querySelectorAll(".sets button");
    const photos = [...document.querySelectorAll(".grid img")];
    const empty = document.querySelector(".sets-empty");
    const viewer = document.querySelector(".viewer");
    const viewerImg = viewer.querySelector("img");
    const viewerCaption = viewer.querySelector(".viewer-caption");
    let openIndex = -1;
    let touchX = 0;

    function credit(photo) {
      const photographer = photo.dataset.photographer || "Model's own";
      const client = photo.dataset.client;
      return client ? "Photographer: " + photographer + " · Client: " + client : "Photographer: " + photographer;
    }

    photos.forEach((photo) => {
      photo.closest(".shot").querySelector("figcaption").textContent = credit(photo);
    });

    function visiblePhotos() {
      return photos.filter((photo) => !photo.closest(".shot").hidden);
    }

    function applyFilter(category) {
      let shown = 0;
      filters.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.filter === category ? "true" : "false");
      });
      photos.forEach((photo) => {
        const match = category === "all" || photo.dataset.category === category;
        photo.closest(".shot").hidden = !match;
        if (match) shown += 1;
      });
      empty.hidden = shown > 0;
    }

    filters.forEach((button) => {
      button.addEventListener("click", () => applyFilter(button.dataset.filter));
    });

    function showPhoto(index) {
      const list = visiblePhotos();
      if (!list.length) return;
      openIndex = (index + list.length) % list.length;
      const photo = list[openIndex];
      viewerImg.src = photo.src;
      viewerImg.alt = photo.alt;
      viewerCaption.textContent = credit(photo);
      viewer.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      viewer.hidden = true;
      viewerImg.removeAttribute("src");
      document.body.style.overflow = "";
      openIndex = -1;
    }

    photos.forEach((photo) => {
      photo.addEventListener("click", () => {
        showPhoto(visiblePhotos().indexOf(photo));
      });
    });

    viewer.querySelector(".prev").addEventListener("click", (event) => {
      event.stopPropagation();
      showPhoto(openIndex - 1);
    });
    viewer.querySelector(".next").addEventListener("click", (event) => {
      event.stopPropagation();
      showPhoto(openIndex + 1);
    });
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (viewer.hidden) return;
      if (event.key === "Escape") closeViewer();
      else if (event.key === "ArrowRight") showPhoto(openIndex + 1);
      else if (event.key === "ArrowLeft") showPhoto(openIndex - 1);
    });
    viewer.addEventListener("touchstart", (event) => {
      touchX = event.changedTouches[0].clientX;
    }, { passive: true });
    viewer.addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) < 40) return;
      showPhoto(openIndex + (delta < 0 ? 1 : -1));
    }, { passive: true });
  </script>
