  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
    }
    .logo {
      display: block;

    .logo-name {
      font-family: "Great Vibes", cursive;

    }
    .logo-tag {

      font-size: 18px;
      font-weight: 300;
      letter-spacing: 4px;
      fill: #111;
      text-anchor: middle;
    }
    .nav {
      padding: 0.4rem 2rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #111;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .nav a {
        margin: 0 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 1px;
      }
    }
    .portfolio {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .portfolio img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 3rem;
    }
    .credit {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: -2.5rem;
      margin-bottom: 3rem;
    }
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    footer a {
      color: #b0b0b0;
      margin: 0 0.55rem;
      display: inline-flex;
      text-decoration: none;
    }
    footer a:hover { color: #666; }
    footer svg { display: block; }
